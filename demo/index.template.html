<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国省份互动地图 · 独立示例</title><link rel="stylesheet" href="./travel-map.css"><link rel="stylesheet" href="./demo.css"><script type="module" src="./demo.js"></script></head>
<body><main><header><p class="eyebrow">CHINA TRAVEL MAP</p><h1>把足迹留在地图上。</h1><p>省份高亮、点击选择与缩放。手机上滑动地图区域，直接滚动页面。</p><small>以下高亮为演示数据。</small></header>
<section class="travel-map" id="example-map" aria-label="省份互动地图示例"><div data-map-shell><!-- MAP_SVG --><div data-map-tooltip hidden></div><p data-map-status role="status"></p><div class="map-actions"><button type="button" data-map-action="overview" aria-label="全国总览" title="全国总览">⌂</button><button type="button" data-map-action="expand" aria-label="展开地图" title="展开地图">⛶</button><button type="button" data-map-action="zoom-in" aria-label="放大地图">＋</button><button type="button" data-map-action="zoom-out" aria-label="缩小地图">−</button></div></div></section>
<div class="map-caption"><a href="https://cloudcenter.tianditu.gov.cn/administrativeDivision/" target="_blank" rel="noopener noreferrer">边界数据 · 天地图 ↗</a><div class="legend"><span><i class="visited"></i>演示高亮</span><span><i class="selected"></i>当前选择</span></div></div>
<div id="province-options" class="province-options" aria-label="演示省份"></div><section class="selection-panel" aria-live="polite"><p class="eyebrow">SELECTION</p><h2 id="selected-name">点击一个省份</h2><p id="selected-description">再次点击同一省份取消选择。选择结果可接入自己的照片、文章或其他内容。</p></section>
<footer><p>纯 SVG · 原生 JavaScript · 无需地图 Key</p><p>此示例不包含个人照片、密码或真实旅行记录。地图数据来源与使用说明见仓库文档。</p></footer></main></body></html>
